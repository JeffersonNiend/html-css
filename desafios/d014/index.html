<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        th {
            border: 1px solid black;
            background-color: gray;
            color: white;
            padding: 10px;
        }
        th.especial {
            background-color: white;
            color: black; 
        }
        th.M {
            text-align: left;
        }
        td {
            border: 1px solid black;
            padding: 7px;
            text-align: center;
        }
        td.Total {
            font-weight: bold;
            background-color: gray;
            color: white;
        }
        td.D {
            text-align: left;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" class="especial" scope="rowgroup">Exatas</th>
                <td class="D">Matemática</td>
                <td>9.5</td>
                <td>8.5</td>
                <td>9.0</td>
            </tr>
            <tr>
                <td class="D">Física</td>
                <td>7.5</td>
                <td>9.0</td>
                <td>8.25</td>
            </tr>
            <tr>
                <td class="D">Química</td>
                <td>7.0</td>
                <td>8.5</td>
                <td>7.75</td>
            </tr>
            <tr>
                <td class="D">Biologia</td>
                <td>9.5</td>
                <td>8.5</td>
                <td>9.0</td>
            </tr>
            <tr>
                <th colspan="4" class="M" scope="row">Média de Exatas</th>
                <td class="Total">8.5</td>
            </tr>
            <tr>
                <th rowspan="2" class="especial" scope="rowgroup">Humanas</th>
                <td class="D">História</td>
                <td>10</td>
                <td>8.0</td>
                <td>9.0</td>
            </tr>
            <tr>
                <td class="D">Geografia</td>
                <td>9.5</td>
                <td>9.5</td>
                <td>9.5</td>
            </tr>
            <tr>
                <th colspan="4" class="M" scope="row">Média de Humanas</th>
                <td class="Total">9.25</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
